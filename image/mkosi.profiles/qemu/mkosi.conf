# Virtual T1 for development: UEFI disk image booted by QEMU (aarch64 virt).
[Output]
Output=blackbird-os-qemu
Format=disk

[Build]
# The test_power build script downloads its pinned source.
WithNetwork=yes

[Content]
# From libpam-systemd on: the shell's session and display stack (dap-shell.service): a logind
# session through PAM, DRM/KMS with GBM and EGL (Mesa, which renders in software when the virtual
# GPU has no 3D), libinput and libseat, and Wayland for the product host.
Bootable=yes
Bootloader=systemd-boot
Packages=
        linux-image-arm64
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        sudo
        libpam-systemd
        libgbm1
        libegl1
        libegl-mesa0
        libgles2
        libgl1-mesa-dri
        libinput10
        libseat1
        libxkbcommon0
        libwayland-client0
        libwayland-server0
        libwayland-egl1
        libfontconfig1
# A product boot shows no text: kernel and systemd messages go to the serial console only, quietly,
# with no cursor on the screen; the screen goes from the boot image to the shell's first frame.
# The "Debug" UKI profile (mkosi.uki-profiles/) is the only boot with consoles and full messages.
KernelCommandLine=console=ttyAMA0 quiet loglevel=3 rd.udev.log_level=3
        systemd.show_status=false vt.global_cursor_default=0
# Development access: root over SSH with the local development key (never in device images).
# The virtual board's support package (virtual-devices export/bsp): its device description comes
# from the running model through fw_cfg, so this image runs every virtual model.
ExtraTrees=../../../build/dev-ssh/tree
        ../../../../virtual-devices/export/bsp
# Virtual battery: build the kernel's test_power module (see scripts/test-power.build.chroot).
BuildPackages=
        linux-headers-arm64
        build-essential
        curl
BuildScripts=scripts/test-power.build.chroot
PostInstallationScripts=scripts/depmod.postinst.chroot
        scripts/session.postinst.chroot
