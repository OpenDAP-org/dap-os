# Virtual T1 for development: UEFI disk image booted by QEMU (aarch64 virt).
[Output]
Output=blackbird-os-qemu
Format=disk

[Build]
# The test_power build script downloads its pinned source.
WithNetwork=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
Packages=
        linux-image-arm64
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        sudo
KernelCommandLine=console=ttyAMA0 video=Virtual-1:320x480
#   The 320x480 portrait panel (faceplate-touch ADR 0001) is set by the kernel; UEFI firmware needs at least 80 columns at boot.
# Development access: root over SSH with the local development key (never in device images).
ExtraTrees=../../../build/dev-ssh/tree
# Virtual battery: build the kernel's test_power module (see scripts/test-power.build.chroot).
BuildPackages=
        linux-headers-arm64
        build-essential
        curl
BuildScripts=scripts/test-power.build.chroot
PostInstallationScripts=scripts/depmod.postinst.chroot
