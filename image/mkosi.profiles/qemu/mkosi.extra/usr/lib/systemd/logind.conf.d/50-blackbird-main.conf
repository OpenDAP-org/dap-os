# The `main` control belongs to the shell, which shows the power choices beside it (system shell
# and UI runtime spec §2). Until odap-shell holds logind's handle-power-key inhibitor (development
# workflow milestone M2), logind ignores a short press. A long press still powers off, so the
# device can always be turned off even if the shell is not running.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
