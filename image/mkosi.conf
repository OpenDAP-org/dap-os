# OpenDAP OS image definition (mkosi). One definition, several outputs selected by profile:
#   mkosi --profile=qemu build     # virtual T1 for development (implemented)
#   t1, oci                        # device image and container (not implemented yet)
[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64
# deb.debian.org (Fastly) intermittently serves empty bodies for large packages; use the kernel.org mirror.
Mirror=https://mirrors.edge.kernel.org/debian

[Output]
ImageId=opendap-os
OutputDirectory=mkosi.output
# Package manifest, used by build/security-check.py.
ManifestFormat=json

[Build]
# Downloaded packages are reused between builds.
CacheDirectory=mkosi.cache

[Content]
# Bootable profiles add the kernel, from trixie-backports (opendap-os ADR 0002); see mkosi.sandbox/ and mkosi.extra/.
Packages=
        systemd
        systemd-sysv
        udev
        dbus
        openssh-server
        iproute2
        less
        ca-certificates
Hostname=opendap-os
Locale=C.UTF-8
Timezone=UTC
